<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0f172a"/>
  <rect x="32" y="32" width="448" height="448" rx="88" fill="url(#grad)" filter="url(#shadow)"/>
  
  <!-- Atom / Science Orbit Graphic -->
  <ellipse cx="256" cy="256" rx="150" ry="55" fill="none" stroke="#ffffff" stroke-width="14" stroke-opacity="0.8" transform="rotate(-30 256 256)"/>
  <ellipse cx="256" cy="256" rx="150" ry="55" fill="none" stroke="#ffffff" stroke-width="14" stroke-opacity="0.8" transform="rotate(30 256 256)"/>
  <ellipse cx="256" cy="256" rx="150" ry="55" fill="none" stroke="#67e8f9" stroke-width="14" stroke-opacity="0.9" transform="rotate(90 256 256)"/>
  
  <!-- Center Core Nucleus & Checkmark -->
  <circle cx="256" cy="256" r="54" fill="#ffffff" filter="url(#shadow)"/>
  <path d="M236 256 L250 270 L280 240" fill="none" stroke="#1d4ed8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
